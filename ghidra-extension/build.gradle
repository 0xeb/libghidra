// Standalone extension build — requires GHIDRA_INSTALL_DIR pointing at a Ghidra distribution.
//
// Usage:
//   gradle buildExtension    -PGHIDRA_INSTALL_DIR=C:/ghidra_dist/ghidra_12.1_DEV
//   gradle installExtension  -PGHIDRA_INSTALL_DIR=C:/ghidra_dist/ghidra_12.1_DEV

if (!hasProperty('GHIDRA_INSTALL_DIR')) {
    throw new GradleException("GHIDRA_INSTALL_DIR is not defined. " +
        "Pass -PGHIDRA_INSTALL_DIR=<path-to-ghidra-distribution>")
}

apply from: new File(GHIDRA_INSTALL_DIR, "support/buildExtension.gradle")

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:4.29.3'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java {
            srcDirs += ['src/main/generated', 'ghidra_scripts']
        }
    }
}

// ---------------------------------------------------------------------------
// Java protobuf stubs.
//
// The generated Java stubs under src/main/generated are COMMITTED to the tree
// and are gencode for protobuf 4.29.3 — the same release train pinned by the
// protobuf-java dependency above (4.29.3) and by the generated C++ SDK
// (gencode 5.29.3, hard-checked with `#if PROTOBUF_VERSION != 5029003`). A
// normal build never needs protoc: it compiles the committed stubs as-is.
//
// Regenerating the stubs with a protoc from a DIFFERENT release train silently
// produces gencode that the pinned protobuf-java runtime cannot compile (e.g.
// "cannot find symbol getMessageType(int)"), so regeneration is:
//   - OFF by default — a protoc on PATH is IGNORED and the committed stubs win;
//   - OPT-IN via -PREGEN_PROTO=true;
//   - version-GUARDED — even when opted in, protoc must be from the required
//     29.x release family (the -PPROTOC escape hatch selects WHICH protoc, it
//     does not bypass the guard).
//
// protoc naming note: protoc release 29.3 reports itself as `libprotoc 29.3`
// (the Java gencode "4.29.3" and C++ "5.29.3" both map to protoc release 29.x).
// ---------------------------------------------------------------------------

// The protobuf release family the committed stubs (and the pinned protobuf-java
// / generated C++ SDK) require. protoc reports this as `libprotoc <MAJOR>.<n>`.
def requiredProtocMajor = 29

def protoRoot = file("${projectDir}/../proto")
def protoDir = file("${protoRoot}/libghidra")
def generatedDir = file("${projectDir}/src/main/generated")

def regenRequested = hasProperty('REGEN_PROTO') && REGEN_PROTO.toString().equalsIgnoreCase('true')

// Locate a protoc binary via -PPROTOC → PROTOC env var → PATH scan.
// Returns null if none is found.
def resolveProtoc = {
    if (hasProperty('PROTOC')) {
        return file(PROTOC)
    }
    if (System.getenv('PROTOC')) {
        return file(System.getenv('PROTOC'))
    }
    def pathDirs = System.getenv('PATH')?.split(File.pathSeparator) ?: []
    def exeName = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'protoc.exe' : 'protoc'
    for (dir in pathDirs) {
        def candidate = new File(dir, exeName)
        if (candidate.isFile() && candidate.canExecute()) {
            return candidate
        }
    }
    return null
}

// Run `protoc --version`, parse the release major, and fail unless it matches
// the required family. Modern protoc prints `libprotoc 29.3`; very old protoc
// prints three components with major 3 (e.g. `libprotoc 3.21.12`) — both the
// two- and three-component forms are handled, and anything but the required
// major aborts.
def assertProtocVersion = { File protoc ->
    // Plain process spawn: this runs at configuration time, where
    // project.exec {} is unavailable on current Gradle.
    def proc = [protoc.absolutePath, '--version'].execute()
    def versionLine = proc.inputStream.text.trim()
    proc.waitFor()
    if (proc.exitValue() != 0) {
        throw new GradleException(
            "libghidra: '${protoc} --version' failed (exit ${proc.exitValue()}).")
    }
    def m = (versionLine =~ /(\d+)\.(\d+)(?:\.(\d+))?/)
    if (!m.find()) {
        throw new GradleException(
            "libghidra: could not parse protoc version from '${versionLine}' (${protoc}).")
    }
    def major = m.group(1).toInteger()
    if (major != requiredProtocMajor) {
        throw new GradleException(
            "libghidra: refusing to regenerate Java stubs with an incompatible protoc.\n" +
            "  found:    ${versionLine} (${protoc})\n" +
            "  required: protoc release ${requiredProtocMajor}.x " +
            "(matches the pinned protobuf-java 4.${requiredProtocMajor}.3 and the C++ 5.${requiredProtocMajor}.3 gencode)\n" +
            "The committed stubs under src/main/generated already match this train, so a\n" +
            "normal build does NOT need protoc — omit -PREGEN_PROTO to use them as-is.\n" +
            "To regenerate, install protoc ${requiredProtocMajor}.3 from\n" +
            "  https://github.com/protocolbuffers/protobuf/releases (tag v${requiredProtocMajor}.3)\n" +
            "and re-run with -PREGEN_PROTO=true (optionally -PPROTOC=<path-to-protoc>).")
    }
    logger.lifecycle("libghidra: protoc ${versionLine} accepted (release ${requiredProtocMajor}.x).")
}

if (regenRequested) {
    def protocBin = resolveProtoc()
    if (protocBin == null || !protocBin.isFile()) {
        throw new GradleException(
            'libghidra: -PREGEN_PROTO=true was requested but no protoc was found. ' +
            'Pass -PPROTOC=<path>, set the PROTOC env var, or add protoc to PATH ' +
            "(protoc ${requiredProtocMajor}.3 from " +
            'https://github.com/protocolbuffers/protobuf/releases).')
    }
    assertProtocVersion(protocBin)

    task generateProto(type: Exec) {
        description = 'Regenerate Java protobuf stubs from .proto files (requires -PREGEN_PROTO=true)'
        group = 'ghidra'
        inputs.dir(protoDir)
        outputs.dir(generatedDir)

        def protoFiles = fileTree(protoDir).matching { include '*.proto' }.files.collect { it.absolutePath }

        commandLine protocBin.absolutePath,
            "--proto_path=${protoRoot.absolutePath}",
            "--java_out=${generatedDir.absolutePath}",
            *protoFiles
    }

    compileJava.dependsOn generateProto
} else {
    // Default path: never regenerate; compile the committed stubs.
    def generatedJavaStubs = fileTree(generatedDir).matching { include '**/*.java' }
    if (generatedJavaStubs.isEmpty()) {
        throw new GradleException(
            'libghidra: the committed Java protobuf stubs under src/main/generated are missing. ' +
            'The source tree looks corrupt — restore them with ' +
            '`git checkout -- src/main/generated`, or regenerate with a compatible protoc via ' +
            "-PREGEN_PROTO=true (protoc ${requiredProtocMajor}.3 from " +
            'https://github.com/protocolbuffers/protobuf/releases).')
    }
    if (resolveProtoc() != null) {
        logger.info('libghidra: using committed Java protobuf stubs (a protoc is on PATH but ' +
            'is ignored; pass -PREGEN_PROTO=true to regenerate).')
    } else {
        logger.info('libghidra: using committed Java protobuf stubs.')
    }
}

// ---------------------------------------------------------------------------
// The extension name — used both as the install directory basename and as a
// safety guard before any recursive delete.
// ---------------------------------------------------------------------------
def extensionName = 'LibGhidraHost'

// ---------------------------------------------------------------------------
// Keep the repo-tree staging lib/ from accumulating stale dependency jars.
//
// Ghidra's buildExtension `copyDependencies` copies runtime deps into the
// repo-tree lib/ directory and explicitly skips jars already present there, so
// an upgraded dependency (e.g. a new protobuf-java version) is ADDED alongside
// the old one rather than replacing it. Wiping lib/ before each build forces a
// clean copy of exactly the current dependency set.
// ---------------------------------------------------------------------------
def stagingLibDir = file("${projectDir}/lib")
if (tasks.findByName('copyDependencies')) {
    tasks.named('copyDependencies').configure {
        doFirst {
            if (stagingLibDir.exists()) {
                logger.lifecycle("libghidra: clearing staging lib/ (${stagingLibDir}) before dependency copy.")
                delete stagingLibDir
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Install extension into the Ghidra distribution.
// Builds the ZIP (via buildExtension), then extracts it into
// <GHIDRA_INSTALL_DIR>/Ghidra/Extensions/LibGhidraHost/.
// The previous install is fully purged first so version-suffixed dependency
// jars (e.g. protobuf-java-<ver>.jar) cannot accumulate across installs.
// ---------------------------------------------------------------------------
task installExtension {
    dependsOn buildExtension
    description = 'Build and install the extension into the Ghidra distribution'
    group = 'ghidra'

    doLast {
        def distDir = file("${projectDir}/dist")
        def zips = distDir.listFiles()?.findAll { it.name.endsWith('.zip') }
        if (!zips) {
            throw new GradleException("No ZIP found in ${distDir}")
        }
        def zipFile = zips.max { it.lastModified() }

        def installDir = file("${GHIDRA_INSTALL_DIR}/Ghidra/Extensions/${extensionName}")

        // Safety guard: only ever delete a path that actually ends with the
        // extension name — never a bare/parent directory.
        if (installDir.name != extensionName) {
            throw new GradleException(
                "libghidra: refusing to delete '${installDir}' — resolved install path does " +
                "not end with the extension name '${extensionName}'.")
        }
        if (installDir.exists()) {
            logger.lifecycle("libghidra: removing previous install at ${installDir}.")
            delete installDir
        }
        installDir.mkdirs()

        // Extract ZIP, stripping the top-level directory
        def zipTree = zipTree(zipFile)
        copy {
            from zipTree
            into installDir
            eachFile { fcd ->
                // Strip top-level dir (e.g. "LibGhidraHost/lib/foo.jar" -> "lib/foo.jar")
                def segments = fcd.relativePath.segments
                if (segments.length > 1) {
                    fcd.relativePath = new RelativePath(!fcd.file.isDirectory(),
                        segments[1..-1] as String[])
                } else {
                    fcd.exclude()
                }
            }
            includeEmptyDirs = false
        }

        // Assert the installed lib/ carries exactly one protobuf-java jar. More
        // than one means stale jars leaked in (an incompatible-version clash at
        // runtime); zero means the dependency failed to package.
        def installedLibDir = new File(installDir, 'lib')
        def protobufJars = installedLibDir.exists() ?
            (installedLibDir.listFiles()?.findAll { it.name ==~ /protobuf-java-.*\.jar/ } ?: []) : []
        if (protobufJars.size() != 1) {
            throw new GradleException(
                "libghidra: expected exactly one protobuf-java-*.jar in ${installedLibDir}, " +
                "found ${protobufJars.size()}: ${protobufJars.collect { it.name }}. " +
                "Stale dependency jars accumulated — remove the extras and reinstall.")
        }

        println "\nInstalled to ${installDir}:"
        installDir.eachFileRecurse { f ->
            println "  ${installDir.toPath().relativize(f.toPath())}"
        }
    }
}
