syntax = "proto3";

package libghidra;

option java_multiple_files = true;
option java_package = "libghidra";
option java_outer_classname = "MemoryProto";

import "libghidra/common.proto";

// Field 1 reserved for future common request context.
message ReadBytesRequest {
  uint64 address = 2;
  uint32 length = 3;
}

message ReadBytesResponse {
  bytes data = 1;
}

// Field 1 reserved for future common request context.
message WriteBytesRequest {
  uint64 address = 2;
  bytes data = 3;
}

message WriteBytesResponse {
  uint32 bytes_written = 1;
}

message BytePatch {
  uint64 address = 1;
  bytes data = 2;
}

// Field 1 reserved for future common request context.
message PatchBytesBatchRequest {
  repeated BytePatch patches = 2;
}

message PatchBytesBatchResponse {
  uint32 patch_count = 1;
  uint32 bytes_written = 2;
}

message MemoryBlockRecord {
  string name = 1;
  uint64 start_address = 2;
  // end_address is INCLUSIVE (Ghidra maxAddress — the last byte of the item).
  uint64 end_address = 3;
  uint64 size = 4;
  bool is_read = 5;
  bool is_write = 6;
  bool is_execute = 7;
  bool is_volatile = 8;
  bool is_initialized = 9;
  string source_name = 10;
  string comment = 11;
}

// Field 1 reserved for future common request context.
message ListMemoryBlocksRequest {
  Pagination page = 2;
}

message ListMemoryBlocksResponse {
  repeated MemoryBlockRecord blocks = 1;
}

// ---- Writable memory map (create / remove / move blocks) ----

// Field 1 reserved for future common request context.
message CreateMemoryBlockRequest {
  string name = 2;
  uint64 start_address = 3;
  uint64 size = 4;
  bool is_read = 5;
  bool is_write = 6;
  bool is_execute = 7;
  bool initialized = 8;  // true: zero-filled initialized block; false: uninitialized (e.g. SRAM)
  bool overlay = 9;
}

message CreateMemoryBlockResponse {
  bool created = 1;
  MemoryBlockRecord block = 2;
}

// Field 1 reserved for future common request context.
message RemoveMemoryBlockRequest {
  uint64 address = 2;  // any address within the target block
}

message RemoveMemoryBlockResponse {
  bool removed = 1;
}

// Field 1 reserved for future common request context.
message MoveMemoryBlockRequest {
  uint64 address = 2;            // any address within the target block
  uint64 new_start_address = 3;  // rebase target
}

message MoveMemoryBlockResponse {
  bool moved = 1;
  MemoryBlockRecord block = 2;
}

// Mutate an EXISTING block's attributes. CreateMemoryBlock already carries name and
// permissions, but only at creation time; there was no way to change them afterwards,
// which is why ghidrasql's segments.name/perm/end_addr stayed read-only while idasql
// and bnsql had them writable.
//
// Every mutable field uses explicit presence: an absent field is left alone, so a
// caller can flip one permission bit without having to restate the others (and without
// this RPC needing to read-modify-write on the client side).
//
// Field 1 reserved for future common request context.
message SetMemoryBlockAttributesRequest {
  uint64 address = 2;               // any address within the target block
  optional string name = 3;         // rename the block
  optional bool is_read = 4;
  optional bool is_write = 5;
  optional bool is_execute = 6;
  // Resize. INCLUSIVE, matching MemoryBlockRecord.end_address and the rest of this
  // service (ghidrasql converts to its exclusive model at the boundary). Growing
  // appends a block of the same initialized-ness and permissions, then joins;
  // shrinking splits at the new end and removes the tail, which DISCARDS the bytes
  // beyond it. Must stay within the same address space and not collide with a
  // neighbouring block.
  optional uint64 end_address = 7;
}

message SetMemoryBlockAttributesResponse {
  bool updated = 1;
  MemoryBlockRecord block = 2;
}

service MemoryService {
  rpc ReadBytes(ReadBytesRequest) returns (ReadBytesResponse);
  rpc WriteBytes(WriteBytesRequest) returns (WriteBytesResponse);
  rpc PatchBytesBatch(PatchBytesBatchRequest) returns (PatchBytesBatchResponse);
  rpc ListMemoryBlocks(ListMemoryBlocksRequest) returns (ListMemoryBlocksResponse);
  rpc CreateMemoryBlock(CreateMemoryBlockRequest) returns (CreateMemoryBlockResponse);
  rpc RemoveMemoryBlock(RemoveMemoryBlockRequest) returns (RemoveMemoryBlockResponse);
  rpc MoveMemoryBlock(MoveMemoryBlockRequest) returns (MoveMemoryBlockResponse);
  rpc SetMemoryBlockAttributes(SetMemoryBlockAttributesRequest) returns (SetMemoryBlockAttributesResponse);
}
